<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer — MobileWise AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f5f5f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .viewer {
            background: white;
            max-width: 800px;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .viewer-header {
            background: #1a3a5c;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .viewer-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .viewer-header .badge {
            background: #f8c400;
            color: #1a3a5c;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .viewer-body {
            padding: 0;
            height: 75vh;
        }
        .viewer-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .viewer-footer {
            padding: 12px 24px;
            background: #fafaf5;
            border-top: 1px solid #e8e8e0;
            text-align: center;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="viewer">
        <div class="viewer-header">
            <h2>📄 Mobile Anaysis Report</h2>
            <span class="badge">MobileWise AI</span>
        </div>
        <div class="viewer-body">
            <iframe src="https://fcgbusobfdwnpoqyuzoe.supabase.co/storage/v1/object/public/PPC-reports/prospects/demo-prospect/demo-report.pdf"></iframe>
        </div>
        <div class="viewer-footer">
            <p>Powered by MobileWise AI — Conversational Smart AI for Mortgage Professionals</p>
        </div>
    </div>
</body>
</html>
