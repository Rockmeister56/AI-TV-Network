<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TV Network - Director's Control Panel</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Lemon Slice Widget Script -->
    <script type="module" src="https://unpkg.com/@lemonsliceai/lemon-slice-widget"></script>
</head>
<body>
    
    <div class="container">
        <!-- LEFT CONTROL DOCK -->
<nav class="control-dock">
    <!-- SLIDE DECK 1: Smart AI Demo -->
    <div class="dock-section">
        <div class="button-glow-group">
            <button class="ctrl-btn nav-btn deck1-prev" title="Previous Slide"><i class="fas fa-backward"></i></button>
            <button class="ctrl-btn nav-btn deck1-next" title="Next Slide"><i class="fas fa-forward"></i></button>
        </div>
        <div class="section-label">Smart AI Demo</div>
    </div>

    <!-- SLIDE DECK 2: AI Review Publisher -->
    <div class="dock-section">
        <div class="button-glow-group">
            <button class="ctrl-btn nav-btn deck2-prev" title="Previous Slide"><i class="fas fa-backward"></i></button>
            <button class="ctrl-btn nav-btn deck2-next" title="Next Slide"><i class="fas fa-forward"></i></button>
        </div>
        <div class="section-label">AI Review Publisher</div>
    </div>

    <!-- SLIDE DECK 3: AI Performance Plan -->
    <div class="dock-section">
        <div class="button-glow-group">
            <button class="ctrl-btn nav-btn deck3-prev" title="Previous Slide"><i class="fas fa-backward"></i></button>
            <button class="ctrl-btn nav-btn deck3-next" title="Next Slide"><i class="fas fa-forward"></i></button>
        </div>
        <div class="section-label">AI Performance Plan</div>
    </div>

    <!-- OVERLAYS -->
    <div class="dock-section">
        <div class="button-glow-group">
            <button class="ctrl-btn action-btn" id="show-testimonial" title="Show Testimonial Center"><i class="fas fa-play-circle"></i></button>
            <button class="ctrl-btn action-btn" id="show-commcenter" title="Show Communication Center"><i class="fas fa-comments"></i></button>
            <button class="ctrl-btn action-btn" id="show-videocenter" title="Show Video Center"><i class="fas fa-video"></i></button>
        </div>
        <div class="section-label">Overlays</div>
    </div>
</nav>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <!-- PRIMARY VIEWING SCREEN -->
            <div class="viewing-screen" id="viewing-screen">
                <!-- SLIDE CONTENT (always visible unless covered) -->
                <div id="slide-content"></div>

                <!-- WEBSITE OVERLAYS (hidden by default, appear ON TOP of slides) -->
                <div class="website-overlay" id="website-1-overlay">
                    <div class="website-content">
                        <img src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/web-markets/legal1.PNG" 
                             alt="Legal Website Example">
                        <button class="website-close">&times;</button>
                    </div>
                </div>

                <div class="website-overlay" id="website-2-overlay">
                    <div class="website-content">
                        <img src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/web-markets/dental-web2.PNG" 
                             alt="Dental Website Example">
                        <button class="website-close">&times;</button>
                    </div>
                </div>

                <div class="website-overlay" id="website-3-overlay">
                    <div class="website-content">
                        <img src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/web-markets/mortgage-web.PNG" 
                             alt="Mortgage Website Example">
                        <button class="website-close">&times;</button>
                    </div>
                </div>

                <div class="website-overlay" id="website-4-overlay">
                    <div class="website-content">
                        <img src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/web-markets/manufacturing.PNG" 
                             alt="Manufacturing Website Example">
                        <button class="website-close">&times;</button>
                    </div>
                </div>

                <!-- OVERLAYS (Centered, Hidden by Default) -->
                <div class="overlay" id="testimonial-overlay">
                    <div class="overlay-content">
                        <img src="assets/testimonial-center.PNG" alt="Testimonial Center" class="overlay-image">
                        <div class="video-click-area" id="testimonial-video-trigger" title="Play Testimonial Video"></div>
                        <button class="overlay-close" id="close-testimonial">&times;</button>
                    </div>
                </div>

                <div class="overlay" id="commcenter-overlay">
                    <div class="overlay-content">
                        <img src="assets/com-center2.PNG" alt="Communication Center" class="overlay-image">
                        <button class="overlay-close" id="close-commcenter">&times;</button>
                    </div>
                </div>

                <div class="overlay" id="videocenter-overlay">
                    <div class="overlay-content">
                        <img src="assets/video-center.png" alt="Video Center" class="overlay-image">
                        <button class="overlay-close" id="close-videocenter">&times;</button>
                    </div>
                </div>
            </div>

    <!-- VIDEO MODAL (Hidden) -->
    <div class="video-modal" id="video-modal">
        <div class="video-modal-content">
            <button class="video-close" id="close-video">&times;</button>
            <video id="demo-video" controls>
                <source src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/sign/video-testimonials/Mortgage%20Broker.mp4?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV9lNjg4MGUyOC0zMDRhLTQ5NzItYmNiMS1iY2U5YjNkOWU1YTkiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ2aWRlby10ZXN0aW1vbmlhbHMvTW9ydGdhZ2UgQnJva2VyLm1wNCIsImlhdCI6MTc2OTkzMTU3MiwiZXhwIjoxODAxNDY3NTcyfQ._nFoTVutqa-VbeUlzj1OqEtIv2i_bTFI8LdajftMdYI" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <footer class="botemia-footer">
    <div class="footer-left">
        <div class="footer-label">Audio Controls</div>
        <button class="footer-btn" id="audio-cues-btn" title="Audio Cues">
            <i class="fas fa-volume-up"></i> Audio
        </button>
    </div>
        
        <div class="footer-center">
    <div class="footer-label">Avatar Controls</div>
    <div class="footer-controls">
        <button class="footer-btn" id="demo-analytics-btn" title="Show Demo Analytics">
            <i class="fas fa-chart-bar"></i> Analytics
        </button>
        <button class="footer-btn" id="footer-stop" title="Stop">
            <i class="fas fa-stop"></i> Stop
        </button>
        <button class="footer-btn" id="footer-mic" title="Toggle Mic">
            <i class="fas fa-microphone"></i> Mic
        </button>
        <button class="footer-btn" id="footer-mute" title="Mute Audio">
            <i class="fas fa-volume-mute"></i> Mute
        </button>
        <button class="footer-btn" id="footer-chat" title="Open Chat">
            <i class="fas fa-comment"></i> Chat
        </button>
        <button class="footer-btn" id="footer-restart" title="Restart Session">
            <i class="fas fa-redo"></i> Restart
        </button>
    </div>
</div>

<!-- ANALYTICS OVERLAY -->
<div id="analytics-overlay" style="display:none; position:fixed; top:-980%; left:50%; transform:translate(-50%, 0); width:90vw; height:85vh; background:#0a0f1e; border-radius:16px; overflow:hidden; z-index:10000; box-shadow:0 20px 60px rgba(0,0,0,0.8);">
    <button onclick="document.getElementById('analytics-overlay').style.display='none'" style="position:absolute; top:10px; right:15px; background:#f44336; color:white; border:none; font-size:1.5rem; cursor:pointer; z-index:10; width:40px; height:40px; border-radius:50%;">&times;</button>
    <iframe src="https://mobilewise.netlify.app/dashboard?clientId=ai-tv-network&demo=true" style="width:100%; height:100%; border:none;"></iframe>
</div>

<!-- AUDIO CUES POPUP -->
<div id="audio-popup" style="display:none; position:fixed; bottom:80px; left:20px; background:rgba(10,20,40,0.95); backdrop-filter:blur(10px); border:1px solid rgba(0,150,255,0.5); border-radius:12px; padding:15px; z-index:10000; min-width:200px;">
    <div style="color:#88ccff; font-weight:600; font-size:0.8rem; text-transform:uppercase; margin-bottom:10px;">Audio Segments</div>
    <button class="footer-btn audio-btn" id="audio-smart-ai" style="width:100%; margin-bottom:8px; justify-content:flex-start;">
        <i class="fas fa-robot"></i> Smart AI
    </button>
    <button class="footer-btn audio-btn" id="audio-perf-plan" style="width:100%; margin-bottom:8px; justify-content:flex-start;">
        <i class="fas fa-chart-line"></i> Perf Plan
    </button>
    <button class="footer-btn audio-btn" id="audio-review" style="width:100%; justify-content:flex-start;">
        <i class="fas fa-star"></i> Reviews
    </button>
</div>

    <!-- JavaScript -->
     <script src="script.js"></script>
    <script src="bridge-ai-tv-network.js"></script>
    <script src="slides.js"></script>
    <script src="slides2.js"></script>
    <script src="slides3.js"></script>
 
</body>
</html>
